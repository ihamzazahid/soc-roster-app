version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - FLASK_ENV=development
      - FLASK_DEBUG=1
    volumes:
      # Syncs host project files into the container live
      - .:/app
      # Explicitly binds instance directory to host filesystem
      - ./instance:/app/instance
    # Overrides Dockerfile CMD to enable live auto-reload
    command: gunicorn --bind 0.0.0.0:5000 --workers 2 --reload run:app